# it; the same rows stay host-plane in rosterless deployments. The disable
# list mirrors the web bundle's takeover: what a preset chooses is which of
# these rows its agent sees at all. The reasoning for each plane decision has
# its one home in the web bundle's patch and the host-plane-ownership note.
